<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-pb)"/>
  <!-- Decorative Grid Lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M133 0 V450 M266 0 V450 M400 0 V450 M533 0 V450 M666 0 V450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Power BI Bar Graph Graphic -->
  <rect x="240" y="240" width="60" height="130" rx="8" fill="url(#bar-grad)" opacity="0.7"/>
  <rect x="330" y="180" width="60" height="190" rx="8" fill="url(#bar-grad)" opacity="0.85"/>
  <rect x="420" y="130" width="60" height="240" rx="8" fill="url(#bar-grad)"/>
  <rect x="510" y="200" width="60" height="170" rx="8" fill="#5B4FE9"/>
  <!-- Trend Line -->
  <path d="M270 220 L360 160 L450 110 L540 180" fill="none" stroke="#D4F550" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="220" r="8" fill="#D4F550"/>
  <circle cx="360" cy="160" r="8" fill="#D4F550"/>
  <circle cx="450" cy="110" r="8" fill="#D4F550"/>
  <circle cx="540" cy="180" r="8" fill="#D4F550"/>
  <!-- Label -->
  <text x="400" y="415" font-family="sans-serif" font-size="22" font-weight="700" fill="#E0E7FF" text-anchor="middle" letter-spacing="2">POWER BI DASHBOARD</text>
</svg>
